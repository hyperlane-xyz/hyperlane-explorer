# Reject packages published less than 7 days ago (supply chain protection)
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@hyperlane-xyz/*'
overrides:
  # TEMPORARY: Cardano support (ProtocolType.Cardano and its address utilities)
  # is not in a published @hyperlane-xyz release yet, so these resolve to
  # tarballs built from a local monorepo checkout. Run
  # `./scripts/link-local-hyperlane.sh` to produce them. Delete this block and
  # bump the versions in package.json once the release lands.
  '@hyperlane-xyz/utils': file:./local-packages/hyperlane-xyz-utils.tgz
  '@hyperlane-xyz/provider-sdk': file:./local-packages/hyperlane-xyz-provider-sdk.tgz
  '@hyperlane-xyz/sdk': file:./local-packages/hyperlane-xyz-sdk.tgz
  '@hyperlane-xyz/widgets': file:./local-packages/hyperlane-xyz-widgets.tgz
  # Re-resolving the @hyperlane-xyz subtree above otherwise pulls the ESM-only
  # uuid v14 into rpc-websockets, which Jest cannot parse. Pin it to what the
  # lockfile resolved before. Goes away with the overrides above.
  'rpc-websockets>uuid': 8.3.2
  tronweb>ethers: ^6.13.5
  ethers: ^5.7
  sha.js: 2.4.12
  cipher-base: 1.0.5
  elliptic: 6.6.1
  pbkdf2: 3.1.3
  form-data: 4.0.4
enablePrePostScripts: true
allowBuilds:
  '@parcel/watcher': false
  bigint-buffer: false
  bufferutil: false
  core-js: false
  esbuild: false
  keccak: false
  protobufjs: false
  secp256k1: false
  sharp: false
  tiny-secp256k1: false
  utf-8-validate: false
